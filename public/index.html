<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShieldNex – Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="brand-logo">S</div>
      <span class="brand-name">ShieldNex</span>
    </div>

    <p id="loading" class="sub">Loading…</p>

    <!-- Logged out -->
    <section id="logged-out" class="hidden">
      <h1>Welcome</h1>
      <p class="sub">Log in with your ID and password, or create a new account.</p>
      <button id="btn-login" class="btn">Log in</button>
      <button id="btn-signup" class="btn secondary">Create account</button>
      <div class="center"><a class="link" href="/forgot.html">Forgot password?</a></div>
    </section>

    <!-- Logged in -->
    <section id="logged-in" class="hidden">
      <h1>You're logged in</h1>
      <p class="sub">Signed in as <span id="user-email" class="user-email"></span></p>
      <button id="btn-logout" class="btn secondary">Log out</button>
    </section>

    <div id="msg" class="msg"></div>
  </main>

  <script src="/config.js"></script>
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
